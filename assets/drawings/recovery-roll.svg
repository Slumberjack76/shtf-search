<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- Roll them toward you: same top-down view. Rescuer in blue holds the person's hand against the cheek and pulls the bent far knee toward themselves; blue arrow shows the roll toward the rescuer -->
