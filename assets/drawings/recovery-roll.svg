  <path d="M90,152 L100,150 M90,157 L101,156" fill="none" stroke-width="1.8"/>
  <!-- rescuer right arm: hand pulling the far knee -->
  <path d="M226,200 C238,194 248,186 254,176" fill="none" stroke="#1A1A1A" stroke-width="17"/>
  <path d="M226,200 C238,194 248,186 254,176" fill="none" stroke="#1B6B93" stroke-width="12"/>
