  <circle cx="76" cy="128" r="23" fill="#EED2A4"/>
  <path d="M76,105 C62,105 53,116 53,128 C53,140 62,151 76,151 C70,146 66,138 66,128 C66,118 70,110 76,105 Z" fill="#5A5A5A"/>
  <path d="M73,118 C75,120 75,123 73,125 M73,131 C75,133 75,136 73,138" fill="none" stroke-width="2"/>
  <path d="M81,124 C85,124 87,128 85,132 C84,133 82,133 81,132" fill="#E2BB82" stroke-width="2"/>
  <path d="M92,124 C93,127 93,130 92,132" fill="none" stroke-width="2"/>
