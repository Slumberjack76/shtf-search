  <path d="M170,190 C170,176 180,168 192,168 C204,168 214,176 214,190 C214,202 204,208 192,208 C180,208 170,202 170,190 Z" fill="#5A5A5A"/>
  <path d="M170,190 C166,188 164,194 168,198 M214,190 C218,188 220,194 216,198" fill="#EED2A4" stroke-width="2"/>
