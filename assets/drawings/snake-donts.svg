<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- Snakebite do-nots: four vignettes of a lower leg with a two-dot bite (cut, suck, ice, tight strap), each crossed out -->
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>

  <!-- (a) top left: pocket knife near the bite -->
  <g>
    <ellipse cx="96" cy="112" rx="88" ry="6" fill="#D6D0C4" stroke="none"/>
    <path d="M0,68 L30,66 L30,108 L0,108 Z" fill="#A8C2CC"/>
    <path d="M28,68 C70,66 110,70 140,76 L140,100 C110,104 70,110 28,108 Z" fill="#EED2A4"/>
    <path d="M30,66 C26,80 26,96 30,108" fill="none" stroke-width="2"/>
    <path d="M136,76 C140,62 150,52 160,52 C168,52 170,60 166,70 L158,106 C150,110 140,108 136,100 Z" fill="#5A5A5A"/>
    <circle cx="86" cy="88" r="2.6" fill="#1A1A1A" stroke="none"/>
    <circle cx="97" cy="89" r="2.6" fill="#1A1A1A" stroke="none"/>
    <!-- knife: handle and blade pointing at the bite -->
    <path d="M36,26 C40,20 48,20 52,24 L72,44 L62,54 L42,34 C36,32 34,30 36,26 Z" fill="#5A5A5A"/>
    <circle cx="46" cy="30" r="2" fill="#D6D0C4" stroke="none"/>
    <path d="M70,44 L94,78 C88,78 80,74 62,54 Z" fill="#FFFFFF"/>
  </g>

  <!-- (b) top right: suction pump on the bite (kept away from the top-right corner) -->
  <g transform="translate(200,14)">
    <ellipse cx="96" cy="112" rx="88" ry="6" fill="#D6D0C4" stroke="none"/>
    <path d="M0,68 L30,66 L30,108 L0,108 Z" fill="#A8C2CC"/>
    <path d="M28,68 C70,66 110,70 140,76 L140,100 C110,104 70,110 28,108 Z" fill="#EED2A4"/>
    <path d="M30,66 C26,80 26,96 30,108" fill="none" stroke-width="2"/>
    <path d="M136,76 C140,62 150,52 160,52 C168,52 170,60 166,70 L158,106 C150,110 140,108 136,100 Z" fill="#5A5A5A"/>
    <!-- pump: cup on the bite, clear barrel, plunger handle -->
    <path d="M78,82 L102,82 L98,70 L82,70 Z" fill="#5A5A5A"/>
    <path d="M82,70 L82,26 L98,26 L98,70 Z" fill="#D7E6EE"/>
    <path d="M86,30 L86,66" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M90,26 L90,12" fill="none" stroke-width="4"/>
    <path d="M76,6 L104,6 L104,14 L76,14 Z" fill="#1B6B93"/>
  </g>

  <!-- (c) bottom left: ice pack on the bite -->
  <g transform="translate(0,152)">
    <ellipse cx="96" cy="112" rx="88" ry="6" fill="#D6D0C4" stroke="none"/>
    <path d="M0,68 L30,66 L30,108 L0,108 Z" fill="#A8C2CC"/>
    <path d="M28,68 C70,66 110,70 140,76 L140,100 C110,104 70,110 28,108 Z" fill="#EED2A4"/>
    <path d="M30,66 C26,80 26,96 30,108" fill="none" stroke-width="2"/>
    <path d="M136,76 C140,62 150,52 160,52 C168,52 170,60 166,70 L158,106 C150,110 140,108 136,100 Z" fill="#5A5A5A"/>
    <!-- ice pack laid on the bite -->
    <path d="M68,62 C68,56 72,54 78,54 L112,56 C118,56 120,60 120,66 L118,92 C118,98 114,100 108,100 L76,98 C70,98 66,94 66,88 Z" fill="#B3C9D0"/>
    <path d="M76,62 L88,62 L88,74 L76,74 Z M94,66 L106,66 L106,78 L94,78 Z M80,80 L92,80 L92,92 L80,92 Z" fill="#FFFFFF" stroke-width="1.8"/>
  </g>

  <!-- (d) bottom right: strap tied tight above the bite -->
  <g transform="translate(204,152)">
    <ellipse cx="96" cy="112" rx="88" ry="6" fill="#D6D0C4" stroke="none"/>
    <path d="M0,68 L30,66 L30,108 L0,108 Z" fill="#A8C2CC"/>
    <path d="M28,68 C40,67 46,67 50,72 C54,72 56,72 60,67 C90,68 115,71 140,76 L140,100 C115,104 90,109 60,109 C56,104 54,104 50,104 C46,109 40,109 28,108 Z" fill="#EED2A4"/>
    <path d="M30,66 C26,80 26,96 30,108" fill="none" stroke-width="2"/>
    <path d="M136,76 C140,62 150,52 160,52 C168,52 170,60 166,70 L158,106 C150,110 140,108 136,100 Z" fill="#5A5A5A"/>
    <circle cx="96" cy="88" r="2.6" fill="#1A1A1A" stroke="none"/>
    <circle cx="107" cy="89" r="2.6" fill="#1A1A1A" stroke="none"/>
    <!-- strap cinched around the leg, buckle and loose tail -->
    <path d="M48,70 L60,70 L60,106 L48,106 Z" fill="#5A5A5A"/>
    <path d="M46,62 L62,62 L62,74 L46,74 Z" fill="none" stroke-width="3"/>
    <path d="M54,62 C52,48 60,38 72,36 L74,44 C66,46 62,52 62,62 Z" fill="#5A5A5A"/>
    <!-- squeeze marks -->
    <path d="M40,60 L46,66 M68,60 L62,66 M40,116 L46,110 M68,116 L62,110" fill="none" stroke-width="2"/>
  </g>

  <!-- gutters between the vignettes -->
  <path d="M196,0 L204,0 L204,300 L196,300 Z M0,146 L400,146 L400,154 L0,154 Z" fill="#D6D0C4" stroke="none"/>

  <!-- red prohibition marks: circle with diagonal slash over each vignette -->
  <g fill="none" stroke="#C62828" stroke-width="6" stroke-opacity="0.85">
    <circle cx="98" cy="74" r="56"/>
    <path d="M58,34 L138,114"/>
    <circle cx="290" cy="90" r="50"/>
    <path d="M255,55 L325,125"/>
    <circle cx="98" cy="226" r="56"/>
    <path d="M58,186 L138,266"/>
    <circle cx="302" cy="226" r="56"/>
    <path d="M262,186 L342,266"/>
  </g>
</svg>
