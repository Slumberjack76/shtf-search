  <path d="M226,196 C236,184 260,186 268,200 L260,244 L222,244 Z" fill="#5A5A5A"/>
  <path d="M166,120 C176,108 200,104 216,110 C238,124 260,160 270,196 C262,210 240,214 226,208 C216,186 202,162 186,142 Z" fill="#1B6B93"/>
  <path d="M200,110 C210,138 228,172 240,206" fill="none" stroke="#14526F" stroke-width="2"/>
  <!-- far arm reaching to the forehead, elbow soft -->
  <path d="M198,122 C190,140 176,158 164,172" fill="none" stroke="#1A1A1A" stroke-width="17"/>
  <path d="M198,122 C190,140 176,158 164,172" fill="none" stroke="#14526F" stroke-width="12"/>
  <path d="M166,168 C156,184 146,196 140,208" fill="none" stroke="#1A1A1A" stroke-width="14"/>
  <path d="M166,168 C156,184 146,196 140,208" fill="none" stroke="#E2BB82" stroke-width="9"/>
  <!-- neck and head looking down -->
  <path d="M158,122 L154,104 L170,100 L176,120 Z" fill="#EED2A4"/>
  <g transform="rotate(-16 164 80)">
    <path d="M140,76 C140,62 152,54 166,56 C180,58 188,70 186,84 C184,98 174,106 160,106 C150,106 142,100 138,94 L132,92 C130,90 132,86 134,85 L138,84 Z" fill="#EED2A4"/>
    <path d="M142,74 C144,58 160,50 176,54 C188,58 192,72 188,84 C184,78 180,72 174,70 C168,74 158,74 148,72 Z" fill="#5A5A5A"/>
    <circle cx="148" cy="82" r="2" fill="#1A1A1A" stroke="none"/>
    <path d="M146,94 C149,96 152,96 154,95" fill="none" stroke-width="2"/>
    <path d="M176,80 C180,78 182,84 178,88" fill="#E2BB82" stroke-width="2"/>
  </g>

  <!-- CHILD on the back, head left (about 7 years old) -->
  <!-- far leg -->
  <path d="M226,212 C252,208 282,210 306,214 L308,228 C282,228 254,228 226,230 Z" fill="#8FB0C2"/>
  <!-- torso and shirt -->
  <path d="M164,224 C172,214 204,212 230,214 L232,254 C210,258 184,258 168,254 C160,248 158,232 164,224 Z" fill="#F5D76E"/>
  <!-- near leg -->
  <path d="M226,220 C254,216 284,218 308,224 L310,250 C284,252 256,254 228,254 Z" fill="#A8C2CC"/>
  <path d="M268,222 C271,230 271,242 268,251" fill="none" stroke-width="1.8"/>
  <!-- small shoes, toes up -->
  <path d="M308,228 C311,218 315,208 321,206 C327,206 328,212 327,222 L324,234 Z" fill="#1A1A1A"/>
  <path d="M304,252 L304,232 C307,222 312,212 318,210 C324,210 325,216 324,226 L322,252 Z" fill="#5A5A5A"/>
  <!-- near arm along the side -->
  <path d="M176,238 C192,241 208,242 222,241" fill="none" stroke="#1A1A1A" stroke-width="13"/>
  <path d="M176,238 C192,241 206,242 212,242" fill="none" stroke="#F5D76E" stroke-width="8.5"/>
  <path d="M206,242 L224,241" fill="none" stroke="#EED2A4" stroke-width="8.5"/>
  <circle cx="227" cy="241" r="5.5" fill="#EED2A4"/>
  <!-- neck and big round head, face up, eyes closed -->
  <path d="M152,230 L166,228 L168,246 L154,248 Z" fill="#EED2A4"/>
  <path d="M122,236 C122,223 132,214 144,214 C156,214 164,224 164,236 C164,248 155,256 143,256 C131,256 122,248 122,236 Z" fill="#EED2A4"/>
  <path d="M143,256 C129,256 121,245 122,234 C123,222 132,214 144,214 C137,219 134,228 137,236 C141,245 150,250 162,249 C157,254 150,256 143,256 Z" fill="#5A5A5A"/>
  <path d="M144,217 C144,212 147,210 150,212 C151,214 149,216 148,217" fill="#EED2A4" stroke-width="2"/>
  <path d="M137,220 C139,222 141,222 143,220" fill="none" stroke-width="2"/>
  <path d="M153,220 C155,222 157,222 159,220" fill="none" stroke-width="2"/>
  <path d="M144,236 C147,234 149,239 146,241" fill="#E2BB82" stroke-width="2"/>

  <!-- hand on the forehead -->
  <path d="M120,220 C120,212 130,207 140,209 C146,211 146,217 141,219 L124,223 C121,223 120,222 120,220 Z" fill="#E2BB82"/>

  <!-- near arm, locked straight, shoulder over the hand -->
  <path d="M190,116 L190,158" fill="none" stroke="#1A1A1A" stroke-width="19"/>
  <path d="M190,116 L190,158" fill="none" stroke="#1B6B93" stroke-width="14"/>
  <path d="M190,152 L190,200" fill="none" stroke="#1A1A1A" stroke-width="16"/>
  <path d="M190,152 L190,200" fill="none" stroke="#EED2A4" stroke-width="11"/>
  <!-- one hand: heel on the center of the chest, fingers lifted -->
  <path d="M198,212 C192,216 182,215 176,210 C170,205 168,200 172,198 C180,196 194,198 200,202 C203,206 202,210 198,212 Z" fill="#EED2A4"/>
  <path d="M176,200 L172,204 M182,199 L178,206" fill="none" stroke-width="2"/>
  <path d="M194,200 C198,200 200,204 196,206" fill="none" stroke-width="2"/>

  <path d="M190,98 L190,214" fill="none" stroke="#1B6B93" stroke-width="2.5" stroke-dasharray="6 7"/>
  <!-- push down, let it come back up -->
  <path d="M110,152 L110,196 M102,162 L110,150 L118,162 M102,186 L110,198 L118,186" fill="none" stroke="#1B6B93" stroke-width="4"/>
