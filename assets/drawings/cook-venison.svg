<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="240" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Deer and elk: 160°F. Not the 145°F beef rule.</text>
  <ellipse cx="90" cy="110" rx="56" ry="30" fill="#C45C4A"/>
  <text x="160" y="90" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">160°F</text>
  <text x="160" y="124" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">steaks, roasts,</text>
  <text x="160" y="146" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">and ground meat</text>
  <text x="16" y="190" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Do not stop at 145°F. That rule is for beef, not this.</text>
  <text x="16" y="216" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">The center of the thickest part.</text>
</svg>
