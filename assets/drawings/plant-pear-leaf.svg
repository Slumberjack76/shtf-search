<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="340" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="20" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Leaf and stem. A food pad is flat and has areoles.</text>
  <rect x="12" y="30" width="180" height="18" fill="#2E6F40" stroke="none"/>
  <text x="20" y="43" fill="#F4F1EA" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">PRICKLY PEAR</text>
  <rect x="206" y="30" width="182" height="18" fill="#C62828" stroke="none"/>
  <text x="214" y="43" fill="#F4F1EA" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">NOT A PAD</text>
  <text x="16" y="66" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LEAF — flat pad</text>
  <ellipse cx="86" cy="124" rx="42" ry="50" fill="#7C9A46"/>
  <g fill="#1A1A1A" stroke="none">
    <circle cx="70" cy="100" r="2.2"/><circle cx="96" cy="96" r="2.2"/><circle cx="78" cy="122" r="2.2"/>
    <circle cx="104" cy="124" r="2.2"/><circle cx="72" cy="146" r="2.2"/><circle cx="98" cy="150" r="2.2"/>
  </g>
  <path d="M70,100 L62,88 M96,96 L104,84 M78,122 L68,116 M104,124 L116,118 M72,146 L64,156 M98,150 L108,160" stroke="#1A1A1A" stroke-width="1.6"/>
  <text x="16" y="186" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Areoles in rows. Each has spines</text>
  <text x="16" y="200" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">and hair-like glochids.</text>
  <text x="210" y="66" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CHOLLA — round joints</text>
  <rect x="230" y="84" width="28" height="62" rx="14" fill="#8FA85A"/>
  <rect x="258" y="108" width="26" height="54" rx="13" fill="#6E8F45"/>
  <rect x="214" y="118" width="24" height="50" rx="12" fill="#9BB56A"/>
  <g stroke="#1A1A1A" stroke-width="1.4">
    <path d="M236,96 L228,88 M244,110 L252,102 M266,124 L274,116 M222,136 L214,128"/>
  </g>
  <text x="210" y="186" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Cylinders, not flat paddles.</text>
  <text x="210" y="200" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Do not cook it as a pad.</text>
  <text x="16" y="224" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">STEM — pads join end to end</text>
  <ellipse cx="70" cy="268" rx="28" ry="34" fill="#7C9A46"/>
  <ellipse cx="108" cy="292" rx="26" ry="30" fill="#6E8F45"/>
  <path d="M88,286 L92,278" stroke="#5A5A5A" stroke-width="4"/>
  <text x="16" y="328" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">A narrow joint. No milky sap.</text>
  <text x="210" y="224" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">EUPHORBIA — smooth sticks</text>
  <path d="M250,250 L250,310" stroke="#3E6B32" stroke-width="10"/>
  <path d="M250,268 L292,246" stroke="#3E6B32" stroke-width="8"/>
  <path d="M250,286 L214,270" stroke="#3E6B32" stroke-width="8"/>
  <path d="M292,246 C298,252 296,260 290,262" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.6"/>
  <text x="210" y="328" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Milky sap. No areoles. Poison.</text>
</svg>
