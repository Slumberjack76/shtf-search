<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="260" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Head and feet come off. They do not go in the pot.</text>
  <ellipse cx="180" cy="120" rx="90" ry="32" fill="#EED2A4"/>
  <circle cx="80" cy="112" r="16" fill="#C4A574" stroke="#C62828" stroke-width="3"/>
  <text x="48" y="160" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">head off</text>
  <path d="M150,148 L140,190" stroke="#C4A574" stroke-width="6"/>
  <path d="M210,148 L220,190" stroke="#C4A574" stroke-width="6"/>
  <text x="120" y="214" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">feet off</text>
  <text x="16" y="246" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Knife edge stays toward the hide, not into the meat.</text>
</svg>
