<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Improved clinch. Five wraps. Do not let them cross.</text>
  <path d="M80,250 L80,220" stroke="#5A5A5A" stroke-width="3"/>
  <circle cx="80" cy="208" r="10" fill="none" stroke="#5A5A5A" stroke-width="3"/>
  <path d="M80,198 L80,50" stroke="#1B6B93" stroke-width="4"/>
  <ellipse cx="80" cy="180" rx="18" ry="8" stroke="#C62828" stroke-width="3"/>
  <ellipse cx="80" cy="158" rx="18" ry="8" stroke="#C62828" stroke-width="3"/>
  <ellipse cx="80" cy="136" rx="18" ry="8" stroke="#C62828" stroke-width="3"/>
  <ellipse cx="80" cy="114" rx="18" ry="8" stroke="#C62828" stroke-width="3"/>
  <ellipse cx="80" cy="92" rx="18" ry="8" stroke="#C62828" stroke-width="3"/>
  <text x="110" y="186" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1  next to the eye</text>
  <text x="110" y="140" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2   3   4</text>
  <text x="110" y="98" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">5</text>
  <text x="110" y="60" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">standing line — to the reel</text>
  <text x="16" y="280" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Heavier line: 5 wraps. Light line: 7. First wrap is by the eye.</text>
