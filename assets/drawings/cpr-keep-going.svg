<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- Keep going: rescuer keeps pushing in a steady loop while a helper hurries in with an AED -->
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>

  <!-- HELPER in the background, hurrying in with the AED -->
  <ellipse cx="330" cy="206" rx="34" ry="4" fill="#D6D0C4" stroke="none"/>
  <!-- speed lines -->
  <path d="M358,118 L382,118 M362,136 L390,136 M358,154 L380,154" fill="none" stroke="#1B6B93" stroke-width="4"/>
  <!-- back leg kicking up behind -->
  <path d="M330,158 L346,180 L366,174" fill="none" stroke="#1A1A1A" stroke-width="15"/>
  <path d="M330,158 L346,180 L366,174" fill="none" stroke="#5A5A5A" stroke-width="10"/>
  <path d="M362,166 C370,164 376,170 374,178 L364,180 Z" fill="#1A1A1A"/>
  <!-- far arm swinging forward -->
  <path d="M324,122 L308,136 L296,128" fill="none" stroke="#1A1A1A" stroke-width="11"/>
  <path d="M324,122 L308,136 L296,128" fill="none" stroke="#E2BB82" stroke-width="7"/>
  <!-- torso leaning forward -->
  <path d="M308,118 C312,108 328,106 334,114 L340,160 C334,166 322,166 318,160 Z" fill="#1B6B93"/>
  <!-- front leg planted -->
  <path d="M326,158 L310,180 L312,202" fill="none" stroke="#1A1A1A" stroke-width="15"/>
  <path d="M326,158 L310,180 L312,202" fill="none" stroke="#5A5A5A" stroke-width="10"/>
  <path d="M296,206 L298,198 C302,194 312,194 318,198 L318,206 Z" fill="#1A1A1A"/>
  <!-- head -->
  <path d="M314,110 L312,100 L322,98 L324,108 Z" fill="#EED2A4"/>
  <path d="M298,90 C298,80 306,74 314,74 C324,74 330,82 330,90 C330,100 322,106 314,106 C306,106 298,100 298,90 Z" fill="#EED2A4"/>
  <path d="M300,86 C300,76 310,70 320,72 C328,74 332,82 330,92 C326,86 322,84 318,84 C312,86 306,86 300,86 Z" fill="#5A5A5A"/>
  <circle cx="304" cy="92" r="1.8" fill="#1A1A1A" stroke="none"/>
  <!-- near arm down, carrying the AED by its handle -->
  <path d="M322,120 L316,140 L310,152" fill="none" stroke="#1A1A1A" stroke-width="12"/>
  <path d="M322,120 L316,140 L310,152" fill="none" stroke="#1B6B93" stroke-width="8"/>
  <path d="M302,154 C300,148 306,146 310,148 C314,150 314,156 310,158" fill="none" stroke-width="4"/>
  <rect x="290" y="156" width="36" height="30" rx="5" fill="#2E6F40"/>
  <path d="M308,180 C300,174 296,170 296,166 C296,162 300,160 303,160 C305,160 307,161 308,163 C309,161 311,160 313,160 C316,160 320,162 320,166 C320,170 316,174 308,180 Z" fill="#FFFFFF" stroke="none"/>
  <path d="M310,162 L305,170 L310,170 L306,177" fill="none" stroke="#2E6F40" stroke-width="2"/>
  <circle cx="309" cy="150" r="5.5" fill="#EED2A4"/>

  <!-- RESCUER doing compressions, side view -->
  <ellipse cx="190" cy="262" rx="140" ry="8" fill="#D6D0C4" stroke="none"/>
  <g transform="translate(14,58) scale(0.78)">
    <!-- RESCUER kneeling on the far side -->
    <!-- far knee and thigh (behind) -->
    <path d="M232,190 C244,184 260,188 264,200 L262,236 L230,236 Z" fill="#5A5A5A"/>
    <!-- near thigh, hip down to knee on the floor -->
    <path d="M212,188 C222,176 246,178 254,192 L246,240 L208,240 Z" fill="#5A5A5A"/>
    <!-- torso leaning forward -->
    <path d="M150,112 C160,100 184,96 200,102 C222,116 246,152 256,188 C248,202 226,206 212,200 C202,178 188,154 170,134 Z" fill="#1B6B93"/>
    <path d="M184,102 C194,130 212,164 226,198" fill="none" stroke="#14526F" stroke-width="2"/>
    <!-- far arm, locked straight -->
    <path d="M186,110 L184,156" fill="none" stroke="#1A1A1A" stroke-width="18"/>
    <path d="M186,110 L184,156" fill="none" stroke="#14526F" stroke-width="13"/>
    <path d="M184,150 L182,194" fill="none" stroke="#1A1A1A" stroke-width="15"/>
    <path d="M184,150 L182,194" fill="none" stroke="#E2BB82" stroke-width="10"/>
    <!-- neck and head, looking down at the hands -->
    <path d="M144,114 L140,96 L156,92 L162,112 Z" fill="#EED2A4"/>
    <g transform="rotate(-16 150 72)">
      <path d="M126,68 C126,54 138,46 152,48 C166,50 174,62 172,76 C170,90 160,98 146,98 C136,98 128,92 124,86 L118,84 C116,82 118,78 120,77 L124,76 Z" fill="#EED2A4"/>
      <path d="M128,66 C130,50 146,42 162,46 C174,50 178,64 174,76 C170,70 166,64 160,62 C154,66 144,66 134,64 Z" fill="#5A5A5A"/>
      <circle cx="134" cy="74" r="2" fill="#1A1A1A" stroke="none"/>
      <path d="M132,86 C135,88 138,88 140,87" fill="none" stroke-width="2"/>
      <path d="M162,72 C166,70 168,76 164,80" fill="#E2BB82" stroke-width="2"/>
    </g>

    <!-- PATIENT on the back, head left -->
    <!-- far leg -->
    <path d="M232,206 C266,200 310,204 346,210 L350,226 C312,224 270,222 232,226 Z" fill="#8FB0C2"/>
    <!-- torso and shirt -->
    <path d="M118,216 C128,206 186,202 236,206 L240,254 C200,258 140,258 122,254 C112,248 110,226 118,216 Z" fill="#F5D76E"/>
    <path d="M132,216 C136,228 136,242 132,252" fill="none" stroke-width="2"/>
    <!-- near leg -->
    <path d="M232,214 C270,210 314,214 350,222 L352,250 C312,252 272,254 236,254 Z" fill="#A8C2CC"/>
    <path d="M296,222 C300,230 300,242 296,251" fill="none" stroke-width="1.8"/>
    <!-- shoes, toes up -->
    <path d="M352,226 C356,212 362,198 370,196 C377,196 379,204 377,216 L374,232 Z" fill="#1A1A1A"/>
    <path d="M346,250 L346,228 C350,214 356,202 364,200 C371,200 373,208 371,220 L368,250 Z" fill="#5A5A5A"/>
    <path d="M346,244 L368,244" fill="none" stroke-width="2"/>
    <!-- near arm along the side -->
    <path d="M136,234 C164,238 196,240 222,238" fill="none" stroke="#1A1A1A" stroke-width="15"/>
    <path d="M136,234 C164,238 196,240 212,239" fill="none" stroke="#F5D76E" stroke-width="10"/>
    <path d="M204,239 L226,238" fill="none" stroke="#EED2A4" stroke-width="10"/>
    <circle cx="230" cy="238" r="6.5" fill="#EED2A4"/>
    <!-- neck and head, face up, eyes closed -->
    <path d="M102,224 L120,220 L122,242 L104,244 Z" fill="#EED2A4"/>
    <path d="M70,232 C70,218 81,209 94,209 C107,209 115,219 115,232 C115,245 105,254 92,254 C80,254 70,245 70,232 Z" fill="#EED2A4"/>
    <path d="M92,254 C77,254 69,242 70,230 C71,216 81,209 93,209 C86,215 83,224 86,233 C90,242 99,248 111,248 C106,252 99,254 92,254 Z" fill="#5A5A5A"/>
    <path d="M94,212 C94,205 98,202 102,205 C103,208 101,211 99,212" fill="#EED2A4" stroke-width="2"/>
    <path d="M86,216 C88,218 91,218 93,216" fill="none" stroke-width="2"/>
    <path d="M105,216 C107,218 109,218 111,216" fill="none" stroke-width="2"/>
    <path d="M94,231 C98,229 100,235 96,237" fill="#E2BB82" stroke-width="2"/>

    <!-- near arm, locked straight, shoulder right above the hands -->
    <path d="M175,108 L174,152" fill="none" stroke="#1A1A1A" stroke-width="19"/>
    <path d="M175,108 L174,152" fill="none" stroke="#1B6B93" stroke-width="14"/>
    <path d="M174,146 L174,192" fill="none" stroke="#1A1A1A" stroke-width="16"/>
    <path d="M174,146 L174,192" fill="none" stroke="#EED2A4" stroke-width="11"/>
    <!-- stacked hands: heel of the bottom hand on the lower breastbone, fingers laced and lifted -->
    <path d="M184,204 C178,209 166,208 158,203 C151,199 147,193 151,190 C160,187 176,189 185,193 C189,197 188,202 184,204 Z" fill="#EED2A4"/>
    <path d="M182,196 C180,184 164,180 156,186 C150,190 152,197 160,198 L180,200 Z" fill="#EED2A4"/>
    <path d="M158,188 L154,194 M164,186 L160,195 M170,186 L167,196" fill="none" stroke-width="2"/>

  </g>

  <!-- keep going loop -->
  <path d="M77,182 A84,84 0 1 1 226,175" fill="none" stroke="#1B6B93" stroke-width="4.5"/>
  <path d="M239,168 L226,175 L223,160" fill="none" stroke="#1B6B93" stroke-width="4.5"/>
</svg>
