<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="260" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Cool it at once. Cook rabbit or squirrel to 165°F.</text>
  <ellipse cx="100" cy="110" rx="60" ry="28" fill="#EED2A4"/>
  <path d="M40,70 L40,40 L160,40 L160,70" stroke="#D6D0C4" stroke-width="4"/>
  <text x="48" y="36" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500">shade, air</text>
  <path d="M230,40 L250,100" stroke="#1B6B93" stroke-width="3"/>
  <circle cx="230" cy="36" r="10" fill="#FFFFFF" stroke="#1B6B93"/>
  <ellipse cx="270" cy="120" rx="50" ry="28" fill="#C45C4A"/>
  <text x="230" y="168" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">165°F in the center</text>
  <text x="16" y="214" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cool the carcass first. Then cook it through.</text>
  <text x="16" y="240" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Color is not the test. The center has to reach 165°F.</text>
</svg>
