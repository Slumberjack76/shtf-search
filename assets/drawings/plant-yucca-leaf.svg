<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="340" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="20" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Leaf and stem. Agave is not yucca. Raw agave burns.</text>
  <rect x="12" y="30" width="180" height="18" fill="#2E6F40" stroke="none"/>
  <text x="20" y="43" fill="#F4F1EA" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">YUCCA</text>
  <rect x="206" y="30" width="182" height="18" fill="#C62828" stroke="none"/>
  <text x="214" y="43" fill="#F4F1EA" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AGAVE — do not eat raw</text>
  <text x="16" y="66" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LEAF — thin, white threads</text>
  <path d="M90,170 L70,78" stroke="#6E8F45" stroke-width="8"/>
  <path d="M90,170 L40,110" stroke="#7C9A46" stroke-width="7"/>
  <path d="M90,170 L140,100" stroke="#6E8F45" stroke-width="7"/>
  <path d="M78,120 C70,118 66,126 74,128 M62,130 C54,128 50,136 58,138" stroke="#F4F1EA" stroke-width="1.6"/>
  <text x="16" y="190" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Narrow sword. Sharp tip. Curling</text>
  <text x="16" y="204" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">fibers. No big teeth on the edge.</text>
  <text x="210" y="66" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LEAF — thick, toothed</text>
  <path d="M300,176 L250,96 L268,100 L246,124 L266,122 L248,148 L300,176 Z" fill="#3E6B32"/>
  <path d="M300,176 L350,96 L332,100 L354,124 L334,122 L352,148 L300,176 Z" fill="#2F6B3A"/>
  <path d="M300,176 L300,86" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="300" cy="84" r="3" fill="#1A1A1A"/>
  <text x="210" y="198" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Fleshy. Teeth along the side.</text>
  <text x="210" y="212" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Big dark spine at the tip.</text>
  <text x="16" y="232" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">STEM — trunk or rosette</text>
  <path d="M90,248 L90,300" stroke="#8A6A42" stroke-width="10"/>
  <path d="M90,268 L70,250 M90,280 L112,262" stroke="#6E8F45" stroke-width="4"/>
  <text x="16" y="324" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Trunk, or a ground rosette.</text>
  <text x="210" y="240" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">STEM — rosette. Blooms once.</text>
  <path d="M300,268 L270,300 M300,268 L300,308 M300,268 L332,300" stroke="#3E6B32" stroke-width="6"/>
  <text x="210" y="324" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Sap burns skin and mouth.</text>
</svg>
