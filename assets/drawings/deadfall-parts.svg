<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="320" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="20" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Three dry sticks. Copy these faces. Not green wood.</text>
  <path d="M46,36 L78,54 L78,118 L62,118 L62,136 L78,136 L78,168 L46,168 Z" fill="#E7D3A8"/>
  <text x="22" y="188" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">UPRIGHT</text>
  <text x="16" y="206" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">top slopes down</text>
  <text x="16" y="222" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">square notch, low,</text>
  <text x="16" y="238" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">on the right edge</text>
  <text x="16" y="254" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">flat bottom — do not stake</text>
  <path d="M150,150 L268,46" stroke="#C4A574" stroke-width="12"/>
  <path d="M252,58 L268,46 L274,66 L258,62 Z" fill="#F4F1EA"/>
  <text x="150" y="176" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">RELEASE</text>
  <text x="140" y="194" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">notch hooks the upright bevel</text>
  <text x="140" y="210" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">short tip: under the log</text>
  <text x="140" y="226" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">long end: down to the bait</text>
  <path d="M36,286 L300,286 L318,278 L300,294 L36,294 Z" fill="#E7D3A8"/>
  <path d="M44,286 L68,276 L76,286 Z" fill="#F4F1EA"/>
  <path d="M168,294 L168,286 L188,286 L188,294 Z" fill="#F4F1EA"/>
  <text x="36" y="274" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">BAIT — hook, then square notch, then the point</text>
  <text x="36" y="312" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">Hook holds the release. Square notch locks into the upright.</text>
</svg>
