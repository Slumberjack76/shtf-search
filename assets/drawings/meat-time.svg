<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Temperature of the thickest meat. Not the air.</text>
  <rect x="28" y="40" width="28" height="168" rx="8" fill="#FFFFFF"/>
  <rect x="32" y="44" width="20" height="48" fill="#3A3A3A" stroke="none"/>
  <rect x="32" y="92" width="20" height="64" fill="#C62828" stroke="none"/>
  <rect x="32" y="156" width="20" height="48" fill="#2E6F40" stroke="none"/>
  <text x="68" y="72" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">140°F and hotter — hot hold, cooked food only</text>
  <text x="68" y="128" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">40°F to 140°F — danger zone</text>
  <text x="68" y="184" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">40°F and colder — hold raw meat here</text>
  <text x="68" y="206" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">Cold is the bottom of this scale. Hot is the top.</text>
  <rect x="16" y="228" width="368" height="58" rx="6" fill="#FFFFFF" stroke="#C62828"/>
  <text x="28" y="252" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Above 90°F air: 1 hour in the danger zone.</text>
  <text x="28" y="272" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cooler air: 2 hours. Then do not eat it.</text>
</svg>
