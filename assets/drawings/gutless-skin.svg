  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">On its side. Short strokes along the backbone.</text>
  <path d="M36,160 C50,120 100,108 170,112 L300,120 C350,128 372,156 366,186 C350,214 300,224 230,220 L100,214 C50,208 36,190 36,160 Z" fill="#EED2A4"/><circle cx="48" cy="142" r="14" fill="#EED2A4"/>
  <text x="28" y="128" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500">head</text>
