<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Hang the pieces apart, in the shade, with air between them.</text>
  <path d="M30,40 L150,24 L200,48 L40,64 Z" fill="#D6D0C4" stroke="none"/>
  <text x="48" y="52" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">SHADE</text>
  <path d="M60,80 L320,80" stroke="#8A6A42" stroke-width="5"/>
  <path d="M100,80 L100,120" stroke="#5A5A5A" stroke-width="2"/>
  <path d="M180,80 L180,120" stroke="#5A5A5A" stroke-width="2"/>
  <path d="M260,80 L260,120" stroke="#5A5A5A" stroke-width="2"/>
  <rect x="84" y="120" width="32" height="48" fill="#C45C4A" stroke="none"/>
  <rect x="164" y="120" width="32" height="48" fill="#C45C4A" stroke="none"/>
  <rect x="244" y="120" width="32" height="48" fill="#C45C4A" stroke="none"/>
  <text x="16" y="200" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Roll to the skinned hide and repeat the other side.</text>
  <text x="16" y="228" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Do not stack warm pieces.</text>
  <text x="16" y="252" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Do not seal them in plastic.</text>
  <text x="16" y="280" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Air has to move around each piece.</text>
</svg>
