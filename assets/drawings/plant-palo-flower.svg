<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="360" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="20" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Flower, pod, and root. Do not cook on oleander sticks.</text>
  <rect x="12" y="30" width="180" height="18" fill="#2E6F40" stroke="none"/>
  <text x="20" y="43" fill="#F4F1EA" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">PALO VERDE</text>
  <rect x="206" y="30" width="182" height="18" fill="#C62828" stroke="none"/>
  <text x="214" y="43" fill="#F4F1EA" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">OLEANDER</text>
  <text x="16" y="66" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">FLOWER — yellow, five petals</text>
  <circle cx="70" cy="110" r="22" fill="#F2D15A"/>
  <circle cx="70" cy="110" r="6" fill="#C45C26"/>
  <path d="M70,88 L70,78 M92,110 L104,110 M70,132 L70,144 M48,110 L36,110" stroke="#F2D15A" stroke-width="6"/>
  <text x="16" y="164" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Small yellow flowers along</text>
  <text x="16" y="178" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">the green twigs in spring.</text>
  <text x="210" y="66" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">FLOWER — cluster at the tip</text>
  <circle cx="270" cy="108" r="16" fill="#E07AA8"/>
  <circle cx="298" cy="96" r="14" fill="#F4C2D4"/>
  <circle cx="306" cy="124" r="14" fill="#E07AA8"/>
  <circle cx="270" cy="108" r="3" fill="#F2D15A" stroke="none"/>
  <text x="210" y="164" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Pink, red, or white. Five petals.</text>
  <text x="210" y="178" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">In a bunch at the end of the twig.</text>
  <text x="16" y="204" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">POD — flat, pinched, tan seeds</text>
  <path d="M24,224 C70,214 130,236 170,222 C150,246 60,250 24,236 Z" fill="#C4A574"/>
  <path d="M55,228 L55,238 M90,230 L90,242 M125,228 L125,236" stroke="#8A6A42" stroke-width="1.5"/>
  <text x="16" y="266" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Tan or green seeds. Never red.</text>
  <text x="210" y="204" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">POD — long twin pods</text>
  <path d="M240,220 L330,248" stroke="#6B5344" stroke-width="6"/>
  <path d="M246,236 L336,214" stroke="#6B5344" stroke-width="6"/>
  <text x="210" y="266" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Pods, leaves, and flowers: poison.</text>
  <text x="16" y="292" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ROOT — taproot, not food</text>
  <path d="M60,304 L60,348" stroke="#8A6A42" stroke-width="6"/>
  <path d="M60,324 L40,340 M60,332 L84,346" stroke="#8A6A42" stroke-width="3"/>
  <text x="48" y="348" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11">Cook seeds. Skip moldy pods.</text>
  <text x="210" y="292" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ROOT — poison. Smoke too.</text>
  <path d="M250,308 L250,348" stroke="#6B5344" stroke-width="6"/>
  <path d="M250,328 L228,344 M250,334 L274,348" stroke="#6B5344" stroke-width="3"/>
  <text x="286" y="334" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Do not burn it.</text>
</svg>
