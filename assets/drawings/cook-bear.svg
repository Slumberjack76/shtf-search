<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="260" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Bear, wild pig, javelina: 160°F in the center.</text>
  <text x="24" y="80" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">160°F</text>
  <text x="24" y="120" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">all the way to the center</text>
  <text x="16" y="170" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Drying does not make this meat safe.</text>
  <text x="16" y="194" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Smoking does not. Curing does not.</text>
  <text x="16" y="218" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Freezing alone does not.</text>
  <text x="16" y="246" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">The heat in the center is what makes it safe.</text>
</svg>
