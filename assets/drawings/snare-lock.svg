<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="340" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="20" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cord lock. Count the wraps. 1 and 2, then 3.</text>
  <path d="M150,70 L376,70" stroke="#1B6B93" stroke-width="6"/>
  <path d="M376,70 L362,62 M376,70 L362,78" stroke="#1B6B93" stroke-width="3"/>
  <text x="330" y="58" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">anchor</text>
  <ellipse cx="190" cy="70" rx="16" ry="22" stroke="#C62828" stroke-width="3"/>
  <ellipse cx="232" cy="70" rx="16" ry="22" stroke="#C62828" stroke-width="3"/>
  <ellipse cx="300" cy="70" rx="16" ry="22" stroke="#C45C26" stroke-width="3"/>
  <text x="184" y="46" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="226" y="46" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="294" y="46" fill="#C45C26" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3</text>
  <path d="M300,92 L300,108 L320,108" stroke="#C45C26" stroke-width="3"/>
  <text x="236" y="132" fill="#C45C26" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">tuck the tag</text>
  <path d="M190,92 C190,150 40,150 40,200 C40,246 110,250 150,220 C186,194 210,150 200,110" stroke="#1A1A1A" stroke-width="3"/>
  <text x="52" y="196" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">NOOSE</text>
  <text x="12" y="128" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">1 and 2 face the noose</text>
  <text x="12" y="268" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13">Slide the hitch toward the anchor to shrink the noose.</text>
  <text x="12" y="288" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13">If the noose tries to open, the wraps jam.</text>
  <text x="12" y="308" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13">Wire: twist a small eye. Pass the standing wire through it.</text>
  <text x="12" y="328" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Do not use a slip knot. It opens and lets go.</text>
</svg>
