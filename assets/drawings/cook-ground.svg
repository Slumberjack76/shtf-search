<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="260" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Gut-shot or full of holes: treat it like ground meat.</text>
  <ellipse cx="90" cy="110" rx="50" ry="30" fill="#C45C4A"/>
  <circle cx="70" cy="100" r="4" fill="#F4F1EA" stroke="none"/>
  <circle cx="100" cy="112" r="4" fill="#F4F1EA" stroke="none"/>
  <circle cx="86" cy="124" r="4" fill="#F4F1EA" stroke="none"/>
  <text x="160" y="90" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">160°F</text>
  <text x="160" y="120" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">bacteria are</text>
  <text x="160" y="142" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500">in the middle</text>
  <text x="16" y="190" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Ground bird is 165°F, not 160.</text>
  <text x="16" y="216" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">A clean steak is not this rule. Holes make it this rule.</text>
  <text x="16" y="242" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Cook the center, not just the outside.</text>
</svg>
