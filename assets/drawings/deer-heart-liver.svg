<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="320" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Heart and liver: smooth, wet, dark red. No spots. No bile sac.</text>
  <path d="M40,80 C40,60 90,56 100,80 C108,100 80,118 52,110 Z" fill="#8C3A32"/>
  <text x="36" y="140" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">LIVER</text>
  <text x="36" y="158" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">smooth, wet, dark red</text>
  <text x="36" y="174" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">or purple — animal's right</text>
  <path d="M200,70 C200,54 250,50 258,74 C264,98 230,114 206,104 Z" fill="#8C3A32" stroke="#C62828" stroke-width="3"/>
  <circle cx="220" cy="78" r="4" fill="#FFFFFF" stroke="none"/>
  <circle cx="236" cy="88" r="4" fill="#F5D76E" stroke="none"/>
  <circle cx="228" cy="98" r="3" fill="#FFFFFF" stroke="none"/>
  <text x="188" y="140" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">many spots</text>
  <text x="188" y="158" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">do not keep it</text>
  <path d="M150,190 C150,176 190,172 198,194 C204,214 170,226 150,214 Z" fill="#B22222"/>
  <text x="210" y="208" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">HEART — same rule</text>
  <rect x="16" y="236" width="368" height="68" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="3"/>
  <text x="28" y="260" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">NO BILE SAC. A deer does not have one.</text>
  <text x="28" y="282" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Bad smell, or spots: do not keep the organ.</text>
</svg>
