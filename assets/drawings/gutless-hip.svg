<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Hind leg: knife on the bone. Do not stab into the belly.</text>
  <path d="M36,160 C50,120 100,108 170,112 L300,120 C350,128 372,156 366,186 C350,214 300,224 230,220 L100,214 C50,208 36,190 36,160 Z" fill="#EED2A4"/><circle cx="48" cy="142" r="14" fill="#EED2A4"/>
  <circle cx="300" cy="190" r="16" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="300" cy="190" r="5" fill="#1A1A1A" stroke="none"/>
  <path d="M312,198 L360,236" stroke="#C4A574" stroke-width="12"/>
  <text x="16" y="250" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Ball and socket. Cut the ligaments. Bend the leg free.</text>
  <ellipse cx="250" cy="200" rx="16" ry="10" fill="#F5D76E" stroke="#C62828" stroke-width="2"/>
  <text x="16" y="276" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Bladder and gut sit just inside. Knife stays on the bone.</text>
