  <path d="M228,206 C232,196 252,192 266,196 C270,200 268,206 262,208 L230,210 Z" fill="#EED2A4"/>
  <path d="M230,208 C224,206 222,200 226,198 L238,198" fill="#EED2A4" stroke-width="2"/>
