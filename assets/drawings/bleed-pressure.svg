  <path d="M53,252 C38,252 30,240 31,228 C32,214 42,207 54,207 C47,213 44,222 47,231 C51,240 60,246 72,246 C67,250 60,252 53,252 Z" fill="#5A5A5A"/>
  <path d="M55,210 C55,203 59,200 63,203 C64,206 62,209 60,210" fill="#EED2A4" stroke-width="2"/>
  <path d="M47,214 C49,216 52,216 54,214" fill="none" stroke-width="2"/>
  <path d="M66,214 C68,216 70,216 72,214" fill="none" stroke-width="2"/>
  <path d="M55,229 C59,227 61,233 57,235" fill="#E2BB82" stroke-width="2"/>

  <!-- cloth on the thigh, hands stacked and pressing -->
  <path d="M226,208 C238,202 260,202 272,206 L276,222 C262,228 238,228 222,222 Z" fill="#FFFFFF"/>
  <path d="M236,206 L234,224 M250,204 L250,226 M262,205 L264,224" fill="none" stroke="#D6D0C4" stroke-width="2"/>
