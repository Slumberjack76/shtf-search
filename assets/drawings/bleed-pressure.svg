  <path d="M244,114 C246,136 246,156 246,172" fill="none" stroke="#1B6B93" stroke-width="14"/>
  <path d="M246,166 L246,200" fill="none" stroke="#1A1A1A" stroke-width="16"/>
  <path d="M246,166 L246,200" fill="none" stroke="#EED2A4" stroke-width="11"/>

  <!-- PATIENT lying on the back, head left -->
  <!-- far leg (slightly higher, behind) -->
  <path d="M206,206 C240,200 290,204 334,210 L340,226 C296,224 246,222 206,226 Z" fill="#8FB0C2"/>
  <!-- torso and shirt -->
  <path d="M78,214 C90,202 160,200 206,204 L212,250 C170,254 104,254 82,250 C72,244 70,224 78,214 Z" fill="#F5D76E"/>
