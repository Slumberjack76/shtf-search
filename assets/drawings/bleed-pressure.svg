  <path d="M240,198 L236,204 M248,200 L245,206 M256,200 L254,206" fill="none" stroke-width="2"/>
  <path d="M246,184 L246,170" fill="none" stroke="#1A1A1A" stroke-width="14"/>
  <path d="M246,186 L246,168" fill="none" stroke="#EED2A4" stroke-width="9"/>

  <!-- press arrows -->
  <path d="M206,132 L206,176 M198,166 L206,178 L214,166" fill="none" stroke="#1B6B93" stroke-width="4"/>
