  <!-- near arm resting along the side -->
  <path d="M96,232 C130,236 170,238 196,236" fill="none" stroke="#1A1A1A" stroke-width="15"/>
  <path d="M96,232 C130,236 170,238 186,237" fill="none" stroke="#F5D76E" stroke-width="10"/>
  <path d="M176,237 L200,236" fill="none" stroke="#EED2A4" stroke-width="10"/>
  <circle cx="204" cy="236" r="6.5" fill="#EED2A4"/>
