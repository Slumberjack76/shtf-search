  <path d="M262,118 C264,140 262,162 260,176" fill="none" stroke="#14526F" stroke-width="12"/>
  <path d="M260,170 L256,206" fill="none" stroke="#1A1A1A" stroke-width="15"/>
  <path d="M260,170 L256,206" fill="none" stroke="#E2BB82" stroke-width="10"/>
  <!-- neck and head, looking down at the hands -->
  <path d="M236,104 L232,86 L248,82 L254,102 Z" fill="#EED2A4"/>
  <path d="M222,58 C222,44 234,36 248,38 C262,40 270,52 268,66 C266,80 256,88 242,88 C232,88 224,82 220,76 L214,74 C212,72 214,68 216,67 L220,66 Z" fill="#EED2A4"/>
  <path d="M224,56 C226,40 242,32 258,36 C270,40 274,54 270,66 C266,60 262,54 256,52 C250,56 240,56 230,54 Z" fill="#5A5A5A"/>
  <circle cx="230" cy="64" r="2" fill="#1A1A1A" stroke="none"/>
