<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Scales: tail toward the head. Trout stay in the skin.</text>
  <path d="M40,140 C80,90 190,86 280,116 C310,128 330,140 348,140 C330,152 310,164 280,176 C190,206 80,196 40,156 C28,148 28,148 40,140 Z" fill="#B7C9C4"/><path d="M40,140 L16,122 L22,148 L16,170 L40,156" fill="#8FB0B0"/><circle cx="310" cy="132" r="5" fill="#1A1A1A" stroke="none"/>
  <path d="M90,112 L200,104" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M200,104 L188,98 M200,104 L188,112" stroke-width="2"/>
  <text x="90" y="96" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">scale this way</text>
  <text x="16" y="214" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Trout: leave them in the skin. Do not scale them.</text>
  <text x="16" y="240" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Catfish: do not scale. Cut the skin behind the head</text>
  <text x="16" y="260" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">and pull the skin toward the tail.</text>
  <path d="M300,176 L220,200" stroke="#1B6B93" stroke-width="3"/>
  <path d="M220,200 L232,192 M220,200 L232,208" stroke="#1B6B93" stroke-width="2"/>
</svg>
