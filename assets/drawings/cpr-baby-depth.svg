<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- Infant CPR, side view: baby on a firm table, heel of one hand presses the center of the chest about one third of its depth, then lets it come back up -->
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <ellipse cx="210" cy="262" rx="160" ry="8" fill="#D6D0C4" stroke="none"/>

  <!-- RESCUER standing behind the table, leaning in -->
  <path d="M262,214 L264,256 L282,256 L282,214 Z M288,214 L290,256 L308,256 L308,214 Z" fill="#5A5A5A"/>
  <path d="M258,258 L286,258 L284,250 L262,250 Z M284,258 L312,258 L310,250 L288,250 Z" fill="#1A1A1A"/>
  <path d="M226,110 C236,96 262,94 276,102 C296,124 308,170 308,210 L250,210 C246,178 236,140 226,110 Z" fill="#1B6B93"/>
  <path d="M264,100 C280,130 290,170 292,208" fill="none" stroke="#14526F" stroke-width="2"/>
  <!-- neck and head, looking down at the baby -->
  <path d="M226,112 L220,94 L236,90 L244,108 Z" fill="#EED2A4"/>
  <g transform="rotate(-22 222 76)">
    <path d="M198,72 C198,58 210,50 224,52 C238,54 246,66 244,80 C242,94 232,102 218,102 C208,102 200,96 196,90 L190,88 C188,86 190,82 192,81 L196,80 Z" fill="#EED2A4"/>
    <path d="M200,70 C202,54 218,46 234,50 C246,54 250,68 246,80 C242,74 238,68 232,66 C226,70 216,70 206,68 Z" fill="#5A5A5A"/>
    <circle cx="206" cy="78" r="2" fill="#1A1A1A" stroke="none"/>
    <path d="M204,90 C207,92 210,92 212,91" fill="none" stroke-width="2"/>
    <path d="M234,76 C238,74 240,80 236,84" fill="#E2BB82" stroke-width="2"/>
  </g>

  <!-- TABLE -->
  <path d="M84,218 L84,258 L98,258 L98,218 Z M318,218 L318,258 L332,258 L332,218 Z" fill="#5A5A5A"/>
  <path d="M60,206 L346,206 L346,218 L60,218 Z" fill="#D6D0C4"/>

  <!-- BABY on the back, head left, gold onesie -->
  <!-- far leg, hip bent, knee up -->
  <path d="M206,186 C214,170 230,158 244,160 C254,164 256,174 252,184 L262,196 C266,202 262,206 256,206 L236,206 C232,196 226,190 218,192 Z" fill="#F5D76E"/>
  <!-- torso: chest pressed down under the fingers -->
  <path d="M134,206 L132,188 C132,174 138,166 144,166 C148,166 152,179 164,179 C176,179 180,166 186,166 C200,165 210,170 216,180 C222,190 222,200 220,206 Z" fill="#F5D76E"/>
  <!-- where the chest was before the push -->
  <path d="M138,166 C150,162 180,162 192,166" fill="none" stroke="#1B6B93" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- near leg -->
  <path d="M208,198 C214,182 228,170 240,172 C250,176 250,186 246,194 L252,200 C256,204 254,206 250,206 L214,206 Z" fill="#F5D76E"/>
  <path d="M238,206 C236,198 242,194 248,196" fill="none" stroke-width="2"/>
  <!-- near arm, bent, fist by the side -->
  <path d="M142,186 C148,196 160,200 172,196" fill="none" stroke="#1A1A1A" stroke-width="13"/>
  <path d="M142,186 C148,196 160,200 170,196" fill="none" stroke="#F5D76E" stroke-width="8.5"/>
  <circle cx="176" cy="195" r="6" fill="#EED2A4"/>
  <!-- big round head, face up, eyes closed -->
  <path d="M84,182 C84,167 96,156 111,156 C126,156 137,167 137,182 C137,196 126,206 111,206 C96,206 84,196 84,182 Z" fill="#EED2A4"/>
  <path d="M111,206 C96,206 84,196 84,182 C84,172 89,164 96,160 C94,170 96,182 104,190 C110,196 120,200 130,199 C126,203 119,206 111,206 Z" fill="#E2BB82"/>
  <path d="M90,170 C86,164 88,158 92,156 M96,162 C95,157 98,154 102,153" fill="none" stroke-width="2"/>
  <path d="M116,157 C116,154 119,152 121,154 C122,156 121,157 119,158" fill="#EED2A4" stroke-width="2"/>
  <path d="M108,164 C110,166 112,166 114,164" fill="none" stroke-width="2"/>
  <path d="M124,164 C126,166 128,166 130,164" fill="none" stroke-width="2"/>
  <path d="M110,182 C113,180 115,185 112,187" fill="#E2BB82" stroke-width="2"/>

  <!-- arm from the shoulder down onto the dipped chest, not across the belly -->
  <path d="M232,116 C214,132 196,148 180,160" fill="none" stroke="#1A1A1A" stroke-width="18"/>
  <path d="M232,116 C214,132 196,148 180,160" fill="none" stroke="#1B6B93" stroke-width="13"/>
  <path d="M180,156 C174,160 168,164 166,170" fill="none" stroke="#1A1A1A" stroke-width="15"/>
  <path d="M180,156 C174,160 168,164 166,170" fill="none" stroke="#EED2A4" stroke-width="10"/>
  <!-- heel in the chest dip. Short fingers point toward the head and stop before the face. -->
  <path d="M170,162 C158,168 152,178 156,188 C168,196 188,192 194,180 C196,170 186,160 170,162 Z" fill="#EED2A4"/>
  <path d="M160,174 C152,168 146,164 142,162" fill="#EED2A4"/>
  <path d="M144,162 C148,160 152,162 154,164" fill="none" stroke-width="2"/>

  <!-- push down, let it come back up, over the chest -->
  <path d="M168,108 L168,146 M161,118 L168,106 L175,118 M161,136 L168,148 L175,136" fill="none" stroke="#1B6B93" stroke-width="4"/>
</svg>
