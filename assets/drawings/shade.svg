  <path d="M148,162 C142,180 140,196 142,206" fill="none" stroke="#F5D76E" stroke-width="11"/>
  <path d="M142,200 L142,224" fill="none" stroke="#1A1A1A" stroke-width="13"/>
  <path d="M142,200 L142,224" fill="none" stroke="#EED2A4" stroke-width="8.5"/>
  <circle cx="142" cy="228" r="6" fill="#EED2A4"/>
