  <!-- legs in stride -->
  <path d="M222,206 L250,206 L258,258 L244,260 L236,226 L232,260 L216,260 Z" fill="#5A5A5A"/>
  <path d="M214,258 L234,258 C240,258 242,266 236,268 L212,268 Z" fill="#1A1A1A"/>
  <path d="M244,256 L262,256 C270,257 272,265 266,267 L244,267 Z" fill="#1A1A1A"/>
  <!-- right arm (viewer left) reaching behind the patient's back -->
  <path d="M216,158 C208,174 200,186 192,196" fill="none" stroke="#1A1A1A" stroke-width="17"/>
  <path d="M216,158 C208,174 200,186 192,196" fill="none" stroke="#1B6B93" stroke-width="12"/>
  <!-- torso -->
  <path d="M214,150 C222,144 250,144 258,150 C262,170 258,192 254,210 L218,210 C214,192 210,170 214,150 Z" fill="#1B6B93"/>
  <path d="M236,152 L236,206" fill="none" stroke="#14526F" stroke-width="2"/>

