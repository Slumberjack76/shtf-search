  <path d="M250,256 L400,256 L400,282 L236,282 Z" fill="#D6D0C4" stroke="none"/>
  <ellipse cx="200" cy="270" rx="70" ry="6" fill="#D6D0C4" stroke="none"/>

  <!-- SUN and heat on the left -->
  <circle cx="62" cy="58" r="22" fill="#F5D76E"/>
  <path d="M62,24 L62,14 M62,92 L62,102 M28,58 L18,58 M96,58 L106,58 M38,34 L31,27 M86,34 L93,27 M38,82 L31,89 M86,82 L93,89" fill="none" stroke="#E08A00" stroke-width="3"/>
  <path d="M34,128 C40,120 46,136 52,128 C58,120 64,136 70,128 C76,120 82,136 88,128" fill="none" stroke="#E08A00" stroke-width="3"/>
  <path d="M28,160 C34,152 40,168 46,160 C52,152 58,168 64,160 C70,152 76,168 82,160" fill="none" stroke="#E08A00" stroke-width="3"/>
  <path d="M40,192 C46,184 52,200 58,192 C64,184 70,200 76,192 C82,184 88,200 94,192" fill="none" stroke="#E08A00" stroke-width="3"/>
  <!-- small desert plant -->
  <path d="M104,262 L104,226 M104,240 C96,240 94,234 94,226 M104,236 C112,236 114,230 114,222" fill="none" stroke="#2E6F40" stroke-width="7"/>

  <!-- RAMADA on the right (roof kept below the top-right corner) -->
  <path d="M276,96 L276,262 M384,96 L384,262" fill="none" stroke="#1A1A1A" stroke-width="11"/>
  <path d="M276,96 L276,262 M384,96 L384,262" fill="none" stroke="#5A5A5A" stroke-width="6"/>
  <path d="M252,80 L398,80 L398,98 L252,98 Z" fill="#5A5A5A"/>
  <path d="M262,80 L262,98 M282,80 L282,98 M302,80 L302,98 M322,80 L322,98 M342,80 L342,98 M362,80 L362,98 M382,80 L382,98" fill="none" stroke="#1A1A1A" stroke-width="1.8"/>

