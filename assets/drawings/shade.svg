  <path d="M190,158 C202,146 216,143 226,143" fill="none" stroke="#F5D76E" stroke-width="10"/>
  <path d="M222,143 C236,142 250,143 258,150" fill="none" stroke="#EED2A4" stroke-width="10"/>
  <!-- patient neck and head, tilted, eyes half closed, sweating -->
  <path d="M164,140 L178,138 L180,152 L166,154 Z" fill="#EED2A4"/>
  <path d="M152,120 C150,106 160,96 173,96 C186,96 194,106 194,119 C194,132 185,142 173,142 C162,142 154,134 152,120 Z" fill="#EED2A4"/>
  <path d="M152,120 C148,104 160,92 174,94 C186,95 195,104 194,116 C188,108 180,104 172,104 C164,106 158,112 156,122 Z" fill="#5A5A5A"/>
  <path d="M174,118 C177,120 180,120 182,118" fill="none" stroke-width="2"/>
  <path d="M186,118 C188,120 190,120 192,118" fill="none" stroke-width="2"/>
  <path d="M180,132 C183,131 186,131 188,132" fill="none" stroke-width="2"/>
  <path d="M160,122 C164,120 166,126 162,128" fill="#E2BB82" stroke-width="2"/>
  <path d="M148,128 C145,133 146,137 149,137 C152,137 152,133 148,128 Z" fill="#D7E6EE" stroke-width="1.8"/>
  <path d="M199,114 C196,119 197,123 200,123 C203,123 203,119 199,114 Z" fill="#D7E6EE" stroke-width="1.8"/>

  <!-- helper neck and head, looking at patient -->
  <path d="M229,132 L243,132 L243,146 L229,146 Z" fill="#EED2A4"/>
  <path d="M216,114 C216,100 226,92 238,92 C250,92 258,102 258,114 C258,128 248,136 237,136 C226,136 216,128 216,114 Z" fill="#EED2A4"/>
  <path d="M216,114 C214,98 226,88 240,90 C252,91 260,100 258,112 C254,104 246,100 236,102 C228,104 222,108 220,116 Z" fill="#5A5A5A"/>
  <circle cx="226" cy="116" r="2" fill="#1A1A1A" stroke="none"/>
  <circle cx="240" cy="116" r="2" fill="#1A1A1A" stroke="none"/>
  <path d="M228,126 C231,128 235,128 238,126" fill="none" stroke-width="2"/>
  <path d="M254,114 C258,112 260,118 256,120" fill="#E2BB82" stroke-width="2"/>

  <!-- helper's left arm (viewer right): elbow down, hand up holding the patient's wrist at the shoulder -->
  <path d="M258,154 C266,168 270,180 270,190" fill="none" stroke="#1A1A1A" stroke-width="17"/>
  <path d="M258,154 C266,168 270,180 270,190" fill="none" stroke="#1B6B93" stroke-width="12"/>
  <path d="M270,188 C272,176 270,164 264,156" fill="none" stroke="#1A1A1A" stroke-width="14"/>
  <path d="M270,188 C272,176 270,164 264,156" fill="none" stroke="#EED2A4" stroke-width="9"/>
  <!-- patient's hand draped over the helper's shoulder -->
  <path d="M256,146 C264,146 268,152 266,160 C262,164 256,162 254,156 Z" fill="#EED2A4"/>
  <!-- helper's hand gripping it, thumb on top -->
  <path d="M258,152 C262,146 272,146 274,154 C276,160 270,164 262,162 Z" fill="#EED2A4"/>
  <path d="M262,150 C264,145 270,144 272,148" fill="none" stroke-width="2"/>

  <!-- arrow: moving into the shade -->
  <path d="M150,288 L250,288 M240,280 L252,288 L240,296" fill="none" stroke="#1B6B93" stroke-width="4"/>
</svg>
