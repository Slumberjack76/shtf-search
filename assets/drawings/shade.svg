  <path d="M150,208 L184,208 L188,258 L174,260 L168,228 L162,260 L146,260 Z" fill="#A8C2CC"/>
  <path d="M168,228 L168,252" fill="none" stroke="#8FB0C2" stroke-width="2"/>
  <path d="M144,258 L164,258 C170,258 172,266 166,268 L142,268 Z" fill="#1A1A1A"/>
  <path d="M174,256 L192,256 C200,257 202,265 196,267 L174,267 Z" fill="#1A1A1A"/>
