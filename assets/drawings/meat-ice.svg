<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="280" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Ice: bag the meat, ice around it, drain the melt water.</text>
  <rect x="40" y="50" width="200" height="140" rx="8" fill="#FFFFFF" stroke="#1B6B93" stroke-width="3"/>
  <text x="56" y="74" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">cooler in the shade, lid shut</text>
  <rect x="70" y="100" width="70" height="36" fill="#C45C4A" stroke="none"/>
  <rect x="60" y="90" width="20" height="16" fill="#D7E6EE" stroke="none"/>
  <rect x="150" y="96" width="24" height="18" fill="#D7E6EE" stroke="none"/>
  <rect x="90" y="146" width="28" height="14" fill="#D7E6EE" stroke="none"/>
  <text x="250" y="110" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ice around</text>
  <text x="250" y="132" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">the bag</text>
  <text x="16" y="220" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Drain the melt water.</text>
  <text x="16" y="246" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Do not let the meat sit in blood and water.</text>
</svg>
