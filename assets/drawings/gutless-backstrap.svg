<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Backstrap: outside the spine. Keep the knife shallow.</text>
  <path d="M36,160 C50,120 100,108 170,112 L300,120 C350,128 372,156 366,186 C350,214 300,224 230,220 L100,214 C50,208 36,190 36,160 Z" fill="#EED2A4"/><circle cx="48" cy="142" r="14" fill="#EED2A4"/>
  <path d="M120,128 L300,138 L294,150 L124,142 Z" fill="#C45C4A"/>
  <text x="150" y="146" fill="#FFFFFF" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">backstrap — outside</text>
  <path d="M130,162 L290,172" stroke="#1A1A1A" stroke-width="4"/>
  <text x="150" y="198" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500">spine, under the backstrap</text>
  <path d="M170,136 L240,142" stroke="#1B6B93" stroke-width="3"/>
  <text x="16" y="250" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">It runs from the pelvis toward the neck.</text>
  <text x="16" y="274" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Fillet it off. Do not dive the knife deep.</text>
