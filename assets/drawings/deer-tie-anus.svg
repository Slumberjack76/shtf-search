<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="340" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Tie the anus. Do not cut the bladder tube.</text>
  <path d="M70,48 C70,48 110,70 130,120 L140,230 C150,280 250,280 260,230 L270,120 C290,70 330,48 330,48" stroke="#8A6A42" stroke-width="8" fill="#F7F3EA"/>
  <text x="176" y="44" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">HEAD</text>
  <ellipse cx="150" cy="150" rx="28" ry="18" fill="#E7B4A8" stroke="#C62828" stroke-width="3"/>
  <text x="118" y="146" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">GUT</text>
  <text x="112" y="178" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">don't cut</text>
  <ellipse cx="230" cy="210" rx="22" ry="14" fill="#F5D76E" stroke="#C62828" stroke-width="3"/>
  <text x="200" y="206" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">BLADDER</text>
  <path d="M220,222 L190,268" stroke="#C62828" stroke-width="3"/>
  <text x="16" y="292" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">bladder tube — do not cut</text>
  <circle cx="200" cy="300" r="8" fill="none" stroke="#1B6B93" stroke-width="3"/>
  <path d="M208,300 L248,300" stroke="#1B6B93" stroke-width="3"/>
  <text x="214" y="322" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">circle the anus, tie it, pull it in</text>
  <text x="16" y="336" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500">Deer have no bile sac. The bladder does not join the anus.</text>
</svg>
