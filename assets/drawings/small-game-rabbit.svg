<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="280" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Rabbit: slit the skin across the back. Pull both ways.</text>
  <ellipse cx="180" cy="130" rx="110" ry="40" fill="#C4A574"/>
  <circle cx="70" cy="120" r="16" fill="#EED2A4"/>
  <path d="M120,118 L240,118" stroke="#1B6B93" stroke-width="3"/>
  <path d="M120,118 L108,106 M120,118 L108,130" stroke="#1B6B93" stroke-width="2"/>
  <path d="M240,118 L252,106 M240,118 L252,130" stroke="#1B6B93" stroke-width="2"/>
  <text x="100" y="200" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">cut skin only — not into the meat</text>
  <text x="16" y="236" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Fingers under the hide. Pull toward the head</text>
  <text x="16" y="258" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">and toward the tail.</text>
</svg>
