<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="260" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">A light cloth keeps flies off and still lets air through.</text>
  <rect x="80" y="80" width="80" height="40" fill="#C45C4A" stroke="none"/>
  <path d="M50,70 L230,70 L250,150 L40,150 Z" fill="#D7E6EE" opacity="0.85"/>
  <text x="250" y="100" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">cloth</text>
  <text x="250" y="122" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">air can pass</text>
  <rect x="16" y="180" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="3"/>
  <text x="28" y="206" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">not a sealed bag</text>
  <text x="28" y="226" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">on warm meat</text>
  <text x="200" y="214" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Flies off.</text>
  <text x="200" y="234" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Heat still escapes.</text>
</svg>
