<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="280" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Jerky: heat the strips. Drying alone does not make them safe.</text>
  <rect x="30" y="60" width="120" height="10" fill="#C45C4A" stroke="none"/>
  <rect x="30" y="78" width="120" height="10" fill="#C45C4A" stroke="none"/>
  <text x="160" y="74" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1/4 inch or thinner</text>
  <text x="160" y="96" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">fat trimmed off</text>
  <text x="16" y="140" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Boil until the center of a strip is 160°F.</text>
  <text x="16" y="164" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Quarter-inch strips often take about 5 minutes.</text>
  <text x="16" y="186" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">Thicker strips take longer. Birds: 165°F.</text>
  <text x="16" y="220" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">If you cannot measure a bird strip, do not dry it.</text>
  <text x="16" y="250" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">The heat step is what makes jerky safe.</text>
</svg>
