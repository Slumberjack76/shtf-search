<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="240" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Leftovers: reheat to 165°F. Cool them in shallow pans.</text>
  <text x="24" y="80" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">165°F</text>
  <rect x="180" y="60" width="160" height="28" rx="4" fill="#C45C4A" stroke="none"/>
  <text x="188" y="110" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500">shallow pan</text>
  <text x="16" y="150" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Heat leftovers through, to 165°F.</text>
  <text x="16" y="176" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Spread them so they get cold fast.</text>
  <text x="16" y="204" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">A deep pot of warm leftovers stays in the danger zone.</text>
</svg>
