<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
  <!-- CO safety do/don't: left (X) stove burning in a closed tent, CO alarm sounding, person dizzy; right (check) same person outside in fresh air, stove used on open ground away from the tent -->
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>

  <!-- LEFT PANEL: closed tent, cut away to show inside -->
  <path d="M4,270 L192,270" fill="none" stroke="#D6D0C4" stroke-width="10"/>
