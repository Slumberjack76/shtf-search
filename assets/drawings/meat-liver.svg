<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="280" fill="#F4F1EA" stroke="none"/>
  <text x="12" y="22" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Look at the liver before you keep any of the meat.</text>
  <path d="M24,100 C24,76 110,72 122,100 C130,126 90,146 44,134 Z" fill="#8C3A32"/>
  <text x="24" y="170" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">smooth, wet,</text>
  <text x="24" y="188" fill="#2E6F40" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">dark red or purple</text>
  <path d="M180,100 C180,76 280,72 292,100 C300,126 250,146 198,134 Z" fill="#8C3A32" stroke="#C62828" stroke-width="3"/>
  <circle cx="214" cy="104" r="4" fill="#FFFFFF" stroke="none"/>
  <circle cx="236" cy="116" r="4" fill="#F5D76E" stroke="none"/>
  <circle cx="254" cy="100" r="3" fill="#FFFFFF" stroke="none"/>
  <circle cx="228" cy="128" r="3" fill="#FFFFFF" stroke="none"/>
  <text x="176" y="170" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">many spots, or</text>
  <text x="176" y="188" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">a swollen spleen</text>
  <text x="16" y="230" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Spotted liver: the whole animal is out.</text>
  <text x="16" y="256" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Do not trim around it and keep the rest.</text>
</svg>
