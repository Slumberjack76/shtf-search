  <path d="M150,116 L166,112 M148,124 L164,120" fill="none" stroke-width="1.6"/>

  <!-- blow travels down onto the back -->
  <path d="M176,48 L156,92" fill="none" stroke="#1B6B93" stroke-width="4"/>
  <path d="M148,82 L156,96 L166,84" fill="none" stroke="#1B6B93" stroke-width="4"/>
</svg>
