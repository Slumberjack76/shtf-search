<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-hidden="true" fill="none" stroke="#1A1A1A" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
  <rect width="400" height="300" fill="#F4F1EA" stroke="none"/>
  <!-- fish -->
  <path d="M40,150 C80,90 200,86 300,120 C330,132 350,150 368,150 C350,168 330,186 300,198 C200,230 80,220 40,170 C28,162 28,158 40,150 Z" fill="#B7C9C4"/>
  <path d="M40,150 L16,130 L20,160 L16,186 L40,168" fill="#8FB0B0"/>
  <circle cx="320" cy="142" r="5" fill="#1A1A1A" stroke="none"/>
  <!-- blow -->
  <path d="M300,100 L312,118" stroke="#C62828" stroke-width="3"/>
  <text x="188" y="78" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">blow behind the eyes</text>
  <!-- gill bleed -->
  <path d="M286,128 C292,140 292,162 284,174" stroke="#C62828" stroke-width="3"/>
  <text x="200" y="196" fill="#C62828" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">cut gills to bleed</text>
  <!-- belly cut -->
  <path d="M90,186 L270,160" stroke="#1B6B93" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="90" y="210" fill="#1B6B93" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">cut belly from the vent to the gills</text>
  <!-- scale arrow: tail is left, head is right -->
  <path d="M120,112 L210,104" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M210,104 L198,98 M210,104 L198,112" stroke-width="2"/>
  <text x="118" y="98" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">scale tail toward head</text>
  <!-- bloodline inset -->
  <rect x="16" y="224" width="368" height="66" rx="8" fill="#FFFFFF" stroke="#D6D0C4"/>
  <path d="M36,256 L200,256" stroke="#D6D0C4" stroke-width="8"/>
  <path d="M36,256 L200,256" stroke="#8C3A32" stroke-width="3"/>
  <text x="210" y="252" fill="#8C3A32" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">blood line under the spine</text>
  <text x="210" y="270" fill="#1A1A1A" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="12">scrape it out with a thumb</text>
</svg>
